{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portal feedback</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f3f7f3;color:#17251f;margin:0;padding:28px 16px}main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:14px}h1{color:#175b38}label{display:block;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8ad;border-radius:5px;font:inherit}button{margin-top:18px;padding:11px 18px;background:#176b40;color:white;border:0;border-radius:5px}a{color:#176b40}</style>
  <link rel="stylesheet" href="{% static 'complaints/portal.css' %}"></head><body><main><p><a href="{% url 'complaints:public_dashboard' %}">Home</a></p><h1>Portal feedback and suggestions</h1>{% if messages %}{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% endif %}<form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button type="submit">Send feedback</button></form></main></body></html>
